[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "appartus-world-tile"
version = "0.7.0"
description = "Heightmap (up to 16k x 16k) to crack-free LOD terrain tiles with biome surface weights for ADM"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "numba>=0.60",
    "pillow>=10.0",
    "tifffile>=2024.1",
    "texture2ddecoder>=1.0.6",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
]

[project.scripts]
awt = "awt.cli:main"

[tool.setuptools]
packages = ["awt", "awt.gui"]
